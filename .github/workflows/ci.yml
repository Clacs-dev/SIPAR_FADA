name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  server:
    name: Server (typecheck, build, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Configure test environment
        run: |
          cat > .env <<EOF
          PORT=5000
          DATABASE_URL="file:./dev.db"
          JWT_SECRET="ci-test-secret-nao-usar-em-producao"
          JWT_REFRESH_SECRET="ci-test-refresh-secret-nao-usar-em-producao"
          FRONTEND_URL="http://localhost:5173"
          CORS_ORIGINS="http://localhost:5173"
          SENDGRID_API_KEY=""
          LICENSE_CRL_URL=""
          EOF

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Typecheck + build
        run: npm run build

      - name: Run tests
        run: node --test "dist/tests/*.test.js"

  client:
    name: Client (typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (falha só se piorar a baseline conhecida)
        # O cliente tem 72 erros de tsc pre-existentes, documentados na
        # auditoria de producao (nao bloqueiam o build real, que usa o
        # typecheck mais restrito do vite). Falhar aqui so quando o numero
        # de erros AUMENTA evita um "vermelho" permanente sem deixar passar
        # regressoes novas. Baseline a atualizar (para baixo) a medida que
        # os erros existentes forem corrigidos.
        run: |
          COUNT=$(npm run typecheck 2>&1 | grep -c "error TS" || true)
          echo "Erros de typecheck: $COUNT (baseline: 72)"
          if [ "$COUNT" -gt 72 ]; then
            echo "::error::Typecheck piorou a baseline (72 -> $COUNT)"
            exit 1
          fi

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
